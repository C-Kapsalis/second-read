# Push a tag like v0.2.0 and this builds the zips and publishes the release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh .github/package.sh
      - run: python3 scripts/edit_review.py validate assets/review.example.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Second Read ${GITHUB_REF_NAME#v}" --generate-notes
