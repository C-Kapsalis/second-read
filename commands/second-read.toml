description = "Second Read for copy (email, social, landing page, blog)"
prompt = "Give this a second read: {{args}}. Follow the Second Read rules in AGENTS.md (the copy sections). Find the format, audience, goal and voice; write the fact ledger first; run the universal and format checks, counting rather than estimating; prove each fix with a quote and a named rule and drop anything that passes its rule; give the verdict (Ready to send, Fix first, Do not send), a score and 3-5 ranked fixes, Blockers first; then a rewrite that uses only ledger facts, with [placeholders] for anything missing, and a fact check table of the rewrite."
