<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AlphaProof Code formal verification scope</title>
<desc id="desc">A human-defined specification is checked against unmodified libsignal crates compiled into an AArch64 command-line harness. AI agents search for proofs, which are checked by Lean. The result depends on contracts for cryptographic primitives and covers selected operations, not the complete Signal apps.</desc>
<rect width="1200" height="675" fill="#F4F1E9"/>
<rect x="54" y="44" width="1092" height="587" rx="26" fill="#FBFAF6" stroke="#D9D3C8" stroke-width="2"/>
<text x="92" y="92" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.4" fill="#3E7778">FORMAL VERIFICATION · 10 NOV 2026</text>
<text x="92" y="151" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="#182B38">The proof has a boundary</text>
<text x="92" y="190" font-family="Inter,Arial,sans-serif" font-size="22" fill="#52616A">AlphaProof Code checked stated properties of a defined execution model.</text>
