<text x="124" y="456" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1" fill="#9A4E3E">ASSUMPTIONS AND SCOPE</text>
<text x="124" y="496" font-family="Inter,Arial,sans-serif" font-size="21" fill="#263B45">Cryptographic primitives are supplied as contracts.</text>
<text x="124" y="529" font-family="Inter,Arial,sans-serif" font-size="21" fill="#263B45">The model covers selected two-party operations and stated properties.</text>
<text x="92" y="602" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#182B38">Not a proof of the complete Signal apps or every protocol behavior.</text>
