<title id="title">Qwen4-Max documented capabilities and evidence boundary</title>
<desc id="desc">Alibaba Cloud Model Studio documentation lists text, image and video input, web search, function and parallel tool calling, structured output and OpenAI and Anthropic API compatibility. These are vendor specifications, not independent performance or safety evaluations.</desc>
