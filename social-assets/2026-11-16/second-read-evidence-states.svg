<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Source evidence is not runtime proof</title><desc>Three states keep documentation claims from becoming accidental guarantees.</desc><rect width="1200" height="675" fill="#F4F3EE"/><rect x="56" y="46" width="8" height="26" rx="4" fill="#3B6F9C"/><text x="82" y="67" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5B6C78">SECOND READ · PRODUCT VERIFICATION</text><text x="56" y="137" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="750" fill="#183044">Source evidence is not runtime proof</text><text x="58" y="180" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5B6C78">Three states keep documentation claims from becoming accidental guarantees.</text><rect x="90" y="250" width="317.3333333333333" height="235" rx="18" fill="#FFFFFF" stroke="#D7DEE2" stroke-width="2"/><circle cx="120" cy="284" r="16" fill="#3B6F9C"/><text x="120" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text><text x="114" y="336" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#183044">Source found</text><text x="114" y="376" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5B6C78"><tspan x="114" dy="0">A README or code path</tspan><tspan x="114" dy="29">supports the claim.</tspan></text><path d="M 413.3333333333333 367.5 L 435.3333333333333 367.5" stroke="#3B6F9C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 427.3333333333333 360.5 L 435.3333333333333 367.5 L 427.3333333333333 374.5" stroke="#3B6F9C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="441.3333333333333" y="250" width="317.3333333333333" height="235" rx="18" fill="#FFFFFF" stroke="#D7DEE2" stroke-width="2"/><circle cx="471.3333333333333" cy="284" r="16" fill="#3B6F9C"/><text x="471.3333333333333" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text><text x="465.3333333333333" y="336" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#183044">Runtime observed</text><text x="465.3333333333333" y="376" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5B6C78"><tspan x="465.3333333333333" dy="0">A permitted check</tspan><tspan x="465.3333333333333" dy="29">actually ran.</tspan></text><path d="M 764.6666666666666 367.5 L 786.6666666666666 367.5" stroke="#3B6F9C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 778.6666666666666 360.5 L 786.6666666666666 367.5 L 778.6666666666666 374.5" stroke="#3B6F9C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="792.6666666666666" y="250" width="317.3333333333333" height="235" rx="18" fill="#FFFFFF" stroke="#D7DEE2" stroke-width="2"/><circle cx="822.6666666666666" cy="284" r="16" fill="#3B6F9C"/><text x="822.6666666666666" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text><text x="816.6666666666666" y="336" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#183044">Not tested</text><text x="816.6666666666666" y="376" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5B6C78"><tspan x="816.6666666666666" dy="0">No runtime evidence</tspan><tspan x="816.6666666666666" dy="29">has been collected.</tspan></text><line x1="56" y1="545" x2="1144" y2="545" stroke="#D7DEE2" stroke-width="2"/><text x="58" y="585" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183044">Corroborated source evidence must not be reported as observed behavior.</text><text x="1140" y="635" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5B6C78">FIELD NOTE</text></svg>