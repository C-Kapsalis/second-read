<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Second Read product verifier permission gates</title>
<desc id="desc">Repository inspection is the default. Command execution and HTTP probes require separate explicit permissions. Commands run without a shell in a fixed working directory with stdin closed. Missing evidence is unknown, not pass.</desc>
<rect width="1200" height="675" fill="#F4F1E9"/>
<rect x="54" y="44" width="1092" height="587" rx="26" fill="#FBFAF6" stroke="#D9D3C8" stroke-width="2"/>
<text x="92" y="92" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.4" fill="#3E7778">SECOND READ · PRODUCT VERIFICATION</text>
<text x="92" y="151" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800" fill="#182B38">A documentation check should not run the product</text>
<text x="92" y="190" font-family="Inter,Arial,sans-serif" font-size="22" fill="#52616A">Source inspection is the default. Execution and network probes are separate permissions.</text>
<rect x="92" y="235" width="310" height="238" rx="18" fill="#E8F0ED" stroke="#78A49B" stroke-width="2"/>
<text x="120" y="278" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="1.4" fill="#28615D">DEFAULT</text>
<text x="120" y="326" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="750" fill="#182B38">Inspect source</text>
<text x="120" y="367" font-family="Inter,Arial,sans-serif" font-size="20" fill="#344954">Files · exact text</text>
<text x="120" y="397" font-family="Inter,Arial,sans-serif" font-size="20" fill="#344954">Metadata · structure</text>
<rect x="120" y="426" width="225" height="28" rx="14" fill="#28615D"/>
<text x="232" y="446" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">NO EXECUTION · NO NETWORK</text>
<path d="M420 354 H466" stroke="#7C8A8E" stroke-width="3" fill="none"/>
<path d="M456 344 L468 354 L456 364" stroke="#7C8A8E" stroke-width="3" fill="none"/>
<rect x="486" y="235" width="292" height="238" rx="18" fill="#F6ECDD" stroke="#D5A35C" stroke-width="2"/>
<text x="514" y="278" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="1.1" fill="#8B5B1E">EXPLICIT OPT-IN</text>
<text x="514" y="326" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="750" fill="#182B38">--allow-exec</text>
<text x="514" y="366" font-family="Inter,Arial,sans-serif" font-size="20" fill="#344954">Command probe</text>
<text x="514" y="398" font-family="Inter,Arial,sans-serif" font-size="18" fill="#52616A">shell=False · fixed cwd</text>
<text x="514" y="427" font-family="Inter,Arial,sans-serif" font-size="18" fill="#52616A">stdin closed</text>
<rect x="802" y="235" width="306" height="238" rx="18" fill="#F1E8E4" stroke="#C98A77" stroke-width="2"/>
<text x="830" y="278" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="1.1" fill="#9A4E3E">EXPLICIT OPT-IN</text>
<text x="830" y="326" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="750" fill="#182B38">--allow-network</text>
<text x="830" y="366" font-family="Inter,Arial,sans-serif" font-size="20" fill="#344954">HTTP status probe</text>
<text x="830" y="398" font-family="Inter,Arial,sans-serif" font-size="18" fill="#52616A">No automatic redirects</text>
<text x="830" y="427" font-family="Inter,Arial,sans-serif" font-size="18" fill="#52616A">No permission by default</text>
<rect x="92" y="510" width="1016" height="76" rx="16" fill="#182B38"/>
<text x="600" y="557" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="750" fill="#FFFFFF">No permission or no observation → UNKNOWN, not PASS.</text>
<text x="92" y="610" font-family="Inter,Arial,sans-serif" font-size="15" fill="#78848A">Implementation detail · not a claim that every product behavior has been runtime-tested</text>
</svg>