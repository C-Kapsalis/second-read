<title id="t">Semgrep Agentic AppSec: two separate company-reported claims</title>
<desc id="d">Mandoline is associated with an approximately 65 percent average token-cost reduction in security workflows. Context Layer, which is in private beta, is associated by Semgrep with agents surfacing two to seven times more real vulnerabilities. Semgrep exposes platform tools through MCP and supports importing existing findings into OpenAI Daybreak without rescanning. Claims are company-reported, not independently evaluated here.</desc>
