<title id="title">Semgrep Agentic AppSec platform workflow and company benchmarks</title>
<desc id="desc">Semgrep describes a workflow combining Mandoline code-flow analysis, Context Layer, Guardian and Agentic Workflows, with findings that can be imported into OpenAI Daybreak Defense Factory. More than two times as many vulnerabilities and 65 percent lower token cost are company-reported benchmark claims.</desc>
