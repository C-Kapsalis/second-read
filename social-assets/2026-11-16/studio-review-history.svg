<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>A review should preserve the source</title><desc>The decision history is a separate record, not a rewritten original.</desc><rect width="1200" height="675" fill="#F4F3EE"/><rect x="56" y="46" width="8" height="26" rx="4" fill="#167C80"/><text x="82" y="67" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5B6C78">SECOND READ STUDIO · CURRENT PROTOTYPE</text><text x="56" y="137" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="750" fill="#183044">A review should preserve the source</text><text x="58" y="180" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5B6C78">The decision history is a separate record, not a rewritten original.</text><rect x="54" y="250" width="255" height="235" rx="18" fill="#FFFFFF" stroke="#D7DEE2" stroke-width="2"/><circle cx="84" cy="284" r="16" fill="#167C80"/><text x="84" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text><text x="78" y="336" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#183044">Original source</text><text x="78" y="376" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5B6C78"><tspan x="78" dy="0">Keep the starting text</tspan><tspan x="78" dy="29">unchanged and inspectable.</tspan></text><path d="M 315 367.5 L 327 367.5" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 319 360.5 L 327 367.5 L 319 374.5" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="333" y="250" width="255" height="235" rx="18" fill="#FFFFFF" stroke="#D7DEE2" stroke-width="2"/><circle cx="363" cy="284" r="16" fill="#167C80"/><text x="363" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text><text x="357" y="336" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#183044">Proposed edit</text><text x="357" y="376" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5B6C78"><tspan x="357" dy="0">Quote the passage</tspan><tspan x="357" dy="29">and explain the change.</tspan></text><path d="M 594 367.5 L 606 367.5" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 598 360.5 L 606 367.5 L 598 374.5" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="612" y="250" width="255" height="235" rx="18" fill="#FFFFFF" stroke="#D7DEE2" stroke-width="2"/><circle cx="642" cy="284" r="16" fill="#167C80"/><text x="642" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text><text x="636" y="336" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#183044">Author decision</text><text x="636" y="376" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5B6C78"><tspan x="636" dy="0">Accept or reject</tspan><tspan x="636" dy="29">as a separate event.</tspan></text><path d="M 873 367.5 L 885 367.5" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 877 360.5 L 885 367.5 L 877 374.5" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="891" y="250" width="255" height="235" rx="18" fill="#FFFFFF" stroke="#D7DEE2" stroke-width="2"/><circle cx="921" cy="284" r="16" fill="#167C80"/><text x="921" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text><text x="915" y="336" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#183044">Review history</text><text x="915" y="376" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5B6C78"><tspan x="915" dy="0">Compare decisions</tspan><tspan x="915" dy="29">and export the record.</tspan></text><line x1="56" y1="545" x2="1144" y2="545" stroke="#D7DEE2" stroke-width="2"/><text x="58" y="585" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183044">Current implementation: immutable source text + timestamped decision events.</text><text x="1140" y="635" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5B6C78">FIELD NOTE</text></svg>