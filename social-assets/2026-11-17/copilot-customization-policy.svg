<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Two controls, two different jobs</title><desc id="d">Enterprise Copilot customization controls: plugin-only requirements and marketplace source restrictions are separate settings.</desc>
<rect width="1200" height="675" fill="#F7F8FA"/><rect x="58" y="54" width="1084" height="567" rx="26" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="2"/>
<text x="92" y="111" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.2" fill="#55708A">INDEPENDENT FIELD NOTE · 17 NOV 2026</text>
<text x="92" y="176" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750" fill="#142B45">Two controls, two different jobs</text>
<text x="92" y="218" font-family="Inter,Arial,sans-serif" font-size="23" fill="#50657A">GitHub Copilot Enterprise customization policy</text>
<rect x="92" y="264" width="1016" height="112" rx="18" fill="#EDF3F8" stroke="#9DB1C4" stroke-width="2"/>
<text x="122" y="304" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D">strictPluginOnlyCustomization</text>
<text x="122" y="342" font-family="Inter,Arial,sans-serif" font-size="20" fill="#52677B">Blocks standalone user/project sources for selected categories.</text>
<rect x="92" y="396" width="1016" height="112" rx="18" fill="#EDF3F8" stroke="#9DB1C4" stroke-width="2"/>
<text x="122" y="436" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D">strictKnownMarketplaces</text>
<text x="122" y="474" font-family="Inter,Arial,sans-serif" font-size="20" fill="#52677B">Restricts which marketplace sources can supply eligible plugins.</text>
<rect x="92" y="534" width="1016" height="52" rx="14" fill="#FFF4D6" stroke="#C28B2C" stroke-width="2"/>
<text x="600" y="568" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#75541A">Plugin-only is not a marketplace allowlist.</text>
</svg>