<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Open weights. Restricted territory.</title><desc id="d">MiniMax H3-Image's Community License excludes the EU, UK, United States and Republic of Korea and restricts use and display of outputs outside the permitted territory. MiniMax says its hosted API remains global and that excluded-region organizations can apply for a separate licence; it says applicants with annual revenue below one million dollars may receive a free waiver.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="64" y="78" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700" fill="#0f172a">Open weights. Restricted territory.</text>
<text x="64" y="118" font-family="Inter,Arial,sans-serif" font-size="21" fill="#475569">MiniMax H3-Image Community License and company Q&amp;A</text>
<rect x="64" y="170" width="500" height="244" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
<text x="96" y="216" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#9f1239">Excluded territories</text>
<text x="96" y="264" font-family="Inter,Arial,sans-serif" font-size="21" fill="#0f172a">European Union · United Kingdom</text>
<text x="96" y="302" font-family="Inter,Arial,sans-serif" font-size="21" fill="#0f172a">United States · Republic of Korea</text>
<text x="96" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9f1239">Use and display of outputs are restricted</text>
<text x="96" y="389" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9f1239">outside the Applicable Territory.</text>
<rect x="600" y="170" width="536" height="244" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="632" y="216" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#1e40af">MiniMax's Q&amp;A says</text>
<text x="632" y="264" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">Hosted API remains globally available.</text>
<text x="632" y="302" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">Excluded-region organizations can apply</text>
<text x="632" y="334" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">for a separate licence.</text>
<text x="632" y="382" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1e40af">It says annual revenue below $1m may qualify</text>
<text x="632" y="407" font-family="Inter,Arial,sans-serif" font-size="18" fill="#1e40af">for a free waiver after applying.</text>
<rect x="64" y="464" width="1072" height="108" rx="16" fill="#0f172a"/>
<text x="96" y="508" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">A downloadable checkpoint is not automatic permission.</text>
<text x="96" y="545" font-family="Inter,Arial,sans-serif" font-size="18" fill="#cbd5e1">The waiver statement is MiniMax's own Q&amp;A; confirm written authorization before deployment.</text>
</svg>