<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Open weights. Restricted territory.</title><desc id="d">The MiniMax H3 Image community license excludes the European Union, United Kingdom, United States and Republic of Korea. It also restricts use and display of outputs outside the applicable territory.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="64" y="78" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700" fill="#0f172a">Open weights. Restricted territory.</text>
<text x="64" y="118" font-family="Inter,Arial,sans-serif" font-size="21" fill="#475569">MiniMax-H3-Image Community License Agreement</text>
<rect x="64" y="174" width="500" height="280" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="96" y="222" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#065f46">Downloadable weights</text>
<text x="96" y="272" font-family="Inter,Arial,sans-serif" font-size="22" fill="#0f172a">Public model files</text>
<text x="96" y="316" font-family="Inter,Arial,sans-serif" font-size="22" fill="#0f172a">Community license applies</text>
<text x="96" y="380" font-family="Inter,Arial,sans-serif" font-size="19" fill="#047857">Weights being downloadable</text>
<text x="96" y="410" font-family="Inter,Arial,sans-serif" font-size="19" fill="#047857">does not settle usage rights.</text>
<rect x="600" y="174" width="536" height="280" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
<text x="632" y="222" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#9f1239">Excluded territories</text>
<text x="632" y="272" font-family="Inter,Arial,sans-serif" font-size="22" fill="#0f172a">European Union</text>
<text x="632" y="310" font-family="Inter,Arial,sans-serif" font-size="22" fill="#0f172a">United Kingdom</text>
<text x="632" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#0f172a">United States · Republic of Korea</text>
<text x="632" y="410" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9f1239">Use, distribution and output display are restricted outside the Applicable Territory.</text>
<rect x="64" y="496" width="1072" height="92" rx="16" fill="#0f172a"/>
<text x="96" y="536" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">A separate written licence is the route described for excluded regions.</text>
<text x="96" y="568" font-family="Inter,Arial,sans-serif" font-size="17" fill="#cbd5e1">Read the current agreement and seek legal advice for a specific deployment.</text>
</svg>