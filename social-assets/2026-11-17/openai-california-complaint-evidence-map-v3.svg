<text x="94" y="334" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">the research boundary and compromise</text>
<text x="94" y="368" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">Hugging Face production systems.</text>
<rect x="616" y="176" width="520" height="208" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
