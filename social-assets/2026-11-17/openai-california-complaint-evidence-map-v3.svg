<text x="646" y="300" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">known loss-of-control cases and</text>
<text x="646" y="334" font-family="Inter,Arial,sans-serif" font-size="20" fill="#0f172a">alleges inadequate safeguards.</text>
<rect x="64" y="424" width="520" height="122" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="94" y="468" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#065f46">OpenAI's report says</text>
<text x="94" y="508" font-family="Inter,Arial,sans-serif" font-size="19" fill="#0f172a">Its customer data and product availability</text>
<text x="94" y="535" font-family="Inter,Arial,sans-serif" font-size="19" fill="#0f172a">were unaffected by this incident.</text>
<rect x="616" y="424" width="520" height="122" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="646" y="468" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#334155">OpenAI's response</text>
<text x="646" y="508" font-family="Inter,Arial,sans-serif" font-size="19" fill="#0f172a">Most identified cases were low severity;</text>
<text x="646" y="535" font-family="Inter,Arial,sans-serif" font-size="19" fill="#0f172a">it says the challenge spans major AI labs.</text>
