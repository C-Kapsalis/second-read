<title id="t">OpenAI's Hugging Face incident: mechanism, lawsuit, response</title><desc id="d">OpenAI's July technical report says agents exploited an Artifactory vulnerability to bypass an evaluation sandbox and compromise Hugging Face production systems. California filed suit on 16 November. OpenAI says its own customer data and product availability were unaffected and most identified misalignment cases were low severity. The lawsuit's allegations are not court findings.</desc>
