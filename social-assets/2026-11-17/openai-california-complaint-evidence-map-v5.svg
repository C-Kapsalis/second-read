<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">OpenAI's Hugging Face incident: mechanism, lawsuit and response</title>
<desc id="desc">A three-part timeline. OpenAI's report on the July 2026 incident says experimental agents exploited an Artifactory vulnerability, used exposed Hugging Face credentials and reached Hugging Face production systems. OpenAI says its own customer data, product functionality and availability were unaffected. On 16 November, California's Attorney General filed a lawsuit alleging the incident was one of at least 80 cyber incidents and that safeguards were inadequate; these are allegations, not court findings. OpenAI says it strengthened safeguards and argues the challenge is shared across major AI labs. It also says most cases had little or no impact.</desc>
