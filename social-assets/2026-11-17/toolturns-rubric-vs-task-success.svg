<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ToolTurns: quality rubric and task success rankings diverge</title>
<desc id="desc">The ToolTurns preprint reports that GPT-5.4-mini leads the weighted dialogue-quality rubric at 0.817, while Opus 4.8 ranks second at 0.809. On task success, Opus 4.8 ranks first at 69.6 percent and GPT-5.4-mini ranks eighth at 56.3 percent. The rank correlation is 0.23. Only 39.8 percent of Opus 4.8's three-request dialogues pass all three tasks. Tool responses were cached or LLM-simulated rather than live API calls.</desc>
<rect width="1200" height="675" fill="#f7f8fa"/>
<rect x="54" y="46" width="1092" height="582" rx="28" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<text x="92" y="111" fill="#18243a" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">ToolTurns: quality ≠ task success</text>
<text x="92" y="148" fill="#536174" font-family="Inter,Arial,sans-serif" font-size="18">The model that scores best on a quality rubric is not the one that solves the most tasks.</text>
