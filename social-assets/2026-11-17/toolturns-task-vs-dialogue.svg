<title id="t">One request is not a conversation</title><desc id="d">ToolTurns reports 69.6 percent best request-level success and 39.8 percent full three-request dialogue completion. The paper uses cached or simulated tool responses rather than live provider calls.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="64" y="78" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700" fill="#0f172a">One request is not a conversation</text>
<text x="64" y="118" font-family="Inter,Arial,sans-serif" font-size="21" fill="#475569">ToolTurns · arXiv:2611.14925v1 · 11 November 2026</text>
<text x="64" y="196" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#334155">Best task success across nine models</text>
<text x="64" y="270" font-family="Inter,Arial,sans-serif" font-size="20" fill="#334155">Individual request</text>
<rect x="300" y="235" width="700" height="54" rx="12" fill="#e2e8f0"/>
<rect x="300" y="235" width="487" height="54" rx="12" fill="#2563eb"/>
