<text x="94" y="496" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#9a3412">Important boundary</text>
<text x="94" y="534" font-family="Inter,Arial,sans-serif" font-size="19" fill="#7c2d12">Tool responses came from cache or LLM simulation, not live provider calls.</text>
<text x="64" y="610" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748b">Preprint results under this evaluation protocol; not a universal estimate of deployed-agent success.</text>
