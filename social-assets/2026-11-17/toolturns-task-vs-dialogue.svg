<text x="64" y="370" font-family="Inter,Arial,sans-serif" font-size="20" fill="#334155">All 3 requests in dialogue</text>
<rect x="300" y="335" width="700" height="54" rx="12" fill="#e2e8f0"/>
<rect x="300" y="335" width="279" height="54" rx="12" fill="#0f766e"/>
<text x="600" y="373" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#065f46">39.8%</text>
