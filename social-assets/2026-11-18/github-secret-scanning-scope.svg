<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Copilot secret scanning: the scope</title>
<desc id="desc">GitHub public preview announced 17 November 2026. After opt-in, Copilot security review combines provider-pattern secret detectors with a fine-tuned model to check code changes and added pull request lines. It does not search repository history, is off by default, and scans consume AI credits.</desc>
