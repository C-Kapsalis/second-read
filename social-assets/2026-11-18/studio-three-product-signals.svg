<text x="110" y="263" fill="#69d6c4" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">INTEREST</text>
<text x="110" y="317" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Beta applications</text>
<text x="110" y="363" fill="#b9c7d8" font-family="Inter,Arial,sans-serif" font-size="22">Who wants to try it?</text><rect x="440" y="205" width="320" height="290" rx="20" fill="#16243a" stroke="#8eabff" stroke-width="3"/>
