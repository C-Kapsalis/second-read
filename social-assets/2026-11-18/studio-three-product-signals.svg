<text x="838" y="317" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Completed reviews</text>
<text x="838" y="363" fill="#b9c7d8" font-family="Inter,Arial,sans-serif" font-size="22">Who used the workflow?</text>
<line x1="76" y1="590" x2="1124" y2="590" stroke="#2b3d55" stroke-width="2"/>
<text x="78" y="625" fill="#a9b9ce" font-family="Inter,Arial,sans-serif" font-size="19">Keep interest, distribution and use separate. Do not add them into one flattering number.</text>
