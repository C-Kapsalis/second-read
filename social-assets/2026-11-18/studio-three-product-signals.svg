<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#0b1220"/>
<rect x="32" y="32" width="1136" height="611" rx="28" fill="#101b2d" stroke="#2b3d55" stroke-width="2"/>
<text x="76" y="100" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700">Three product signals. Three questions.</text>
<text x="78" y="145" fill="#a9b9ce" font-family="Inter,Arial,sans-serif" font-size="23">A product metric should say what behaviour it measures.</text>
<rect x="76" y="205" width="320" height="290" rx="20" fill="#16243a" stroke="#69d6c4" stroke-width="3"/>
