<text x="474" y="263" fill="#8eabff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">DISTRIBUTION</text>
<text x="474" y="317" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">GitHub stars</text>
<text x="474" y="363" fill="#b9c7d8" font-family="Inter,Arial,sans-serif" font-size="22">Who noticed the project?</text><rect x="804" y="205" width="320" height="290" rx="20" fill="#16243a" stroke="#f3c46b" stroke-width="3"/>
