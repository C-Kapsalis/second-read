<title id="title">Persistent memory has a lifecycle</title><desc id="desc">Amazon OpenSearch Memory reached general availability on 18 November 2026. Event store: Keep interactions as searchable events; Memory formation: Extract, embed and consolidate memories; Retrieval: Keyword, semantic and hybrid search; Governance: IAM actor/session scope and expiry Persistent context brings retention and access control with it.</desc>
