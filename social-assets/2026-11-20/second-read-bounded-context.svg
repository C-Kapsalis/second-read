<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Bounded context discovery</title>
<desc id="desc">A four-stage diagram shows a user-selected project root, a bounded scan of Markdown files that excludes hidden and cache folders and symlinks outside the root, a candidate map of paths and limited metadata, and a focused read of relevant notes. The tool is a navigation hint, not a full-text index or proof.</desc>
<rect width="1200" height="675" fill="#F4F2EC"/>
<text x="64" y="78" fill="#14283F" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">SECOND READ · OPEN-SOURCE SKILL</text>
<text x="64" y="145" fill="#14283F" font-family="Arial, sans-serif" font-size="48" font-weight="700">Context discovery needs boundaries.</text>
<text x="64" y="188" fill="#526273" font-family="Arial, sans-serif" font-size="24">The loader finds candidate notes. It does not decide that they are true.</text>
<g>
<rect x="64" y="260" width="238" height="190" rx="16" fill="#FFFFFF" stroke="#CBD3D8" stroke-width="2"/>
<text x="88" y="301" fill="#6B7886" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">01 · ROOT</text>
<text x="88" y="352" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">Selected</text>
<text x="88" y="387" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">workspace</text>
<text x="88" y="425" fill="#526273" font-family="Arial, sans-serif" font-size="18">Explicit path</text>
<path d="M310 355 H338" stroke="#81909D" stroke-width="4" stroke-linecap="round"/><path d="M328 343 L340 355 L328 367" fill="none" stroke="#81909D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="354" y="260" width="238" height="190" rx="16" fill="#FFFFFF" stroke="#CBD3D8" stroke-width="2"/>
<text x="378" y="301" fill="#6B7886" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">02 · FILTER</text>
<text x="378" y="352" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">Bounded</text>
<text x="378" y="387" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">scan</text>
<text x="378" y="425" fill="#526273" font-family="Arial, sans-serif" font-size="18">Markdown only</text>
<path d="M600 355 H628" stroke="#81909D" stroke-width="4" stroke-linecap="round"/><path d="M618 343 L630 355 L618 367" fill="none" stroke="#81909D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="644" y="260" width="238" height="190" rx="16" fill="#DCECE9" stroke="#2C7A7B" stroke-width="3"/>
<text x="668" y="301" fill="#2C7A7B" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">03 · CANDIDATES</text>
<text x="668" y="352" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">Paths and</text>
<text x="668" y="387" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">metadata</text>
<text x="668" y="425" fill="#526273" font-family="Arial, sans-serif" font-size="18">Limited link map</text>
<path d="M890 355 H918" stroke="#81909D" stroke-width="4" stroke-linecap="round"/><path d="M908 343 L920 355 L908 367" fill="none" stroke="#81909D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="934" y="260" width="202" height="190" rx="16" fill="#FFFFFF" stroke="#CBD3D8" stroke-width="2"/>
<text x="958" y="301" fill="#6B7886" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">04 · READ</text>
<text x="958" y="352" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">Focused</text>
<text x="958" y="387" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">context</text>
<text x="958" y="425" fill="#526273" font-family="Arial, sans-serif" font-size="18">Relevant notes</text>
<line x1="64" y1="505" x2="1136" y2="505" stroke="#CBD3D8" stroke-width="2"/>
<text x="64" y="555" fill="#14283F" font-family="Arial, sans-serif" font-size="24" font-weight="700">EXCLUDES</text>
<text x="220" y="555" fill="#526273" font-family="Arial, sans-serif" font-size="22">hidden folders · caches · symlinks outside the selected root</text>
<text x="64" y="618" fill="#2C7A7B" font-family="Arial, sans-serif" font-size="29" font-weight="700">NAVIGATION HINT, NOT A FULL-TEXT INDEX OR FACT CHECK.</text>
</svg>