<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Permissions are not the whole policy."><rect width="1200" height="675" fill="#f7f7f3"/><rect x="64" y="52" width="8" height="34" rx="4" fill="#4263eb"/><text x="92" y="76" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#4263eb">AGENT GOVERNANCE · PREVIEW</text><text x="64" y="145" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#172338">Permissions are not the whole policy.</text><text x="64" y="190" font-family="Inter,Arial,sans-serif" font-size="23" fill="#5b6678">Google's preview evaluates a proposed tool call before it reaches the agent's tools.</text><rect x="75" y="250" width="246" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="75" y="250" width="246" height="10" rx="5" fill="#4263eb"/><text x="97" y="302" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#172338">PROPOSED CALL</text><text x="97" y="348" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">Send a file</text><text x="97" y="382" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">to an address</text><text x="97" y="416" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">or invoke a tool</text><path d="M 325 365 h 14 m -10 -8 l 10 8 l -10 8" fill="none" stroke="#4263eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="343" y="250" width="246" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="343" y="250" width="246" height="10" rx="5" fill="#4263eb"/><text x="365" y="302" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#172338">POLICY CHECK</text><text x="365" y="348" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">Plain-language rules</text><text x="365" y="382" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">What is allowed here?</text><text x="365" y="416" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">What is prohibited?</text><path d="M 593 365 h 14 m -10 -8 l 10 8 l -10 8" fill="none" stroke="#4263eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="611" y="250" width="246" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="611" y="250" width="246" height="10" rx="5" fill="#4263eb"/><text x="633" y="302" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#172338">INTENT CHECK</text><text x="633" y="348" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">Does this call still</text><text x="633" y="382" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">match the user's</text><text x="633" y="416" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">original request?</text><path d="M 861 365 h 14 m -10 -8 l 10 8 l -10 8" fill="none" stroke="#4263eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="879" y="250" width="246" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="879" y="250" width="246" height="10" rx="5" fill="#4263eb"/><text x="901" y="302" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#172338">ALLOW / DENY</text><text x="901" y="348" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">Agent Gateway</text><text x="901" y="382" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">enforces the verdict</text><text x="901" y="416" font-family="Inter,Arial,sans-serif" font-size="20" fill="#5b6678">and logs the rationale</text><line x1="64" y1="555" x2="1136" y2="555" stroke="#d9dfeb" stroke-width="2"/><text x="64" y="598" font-family="Inter,Arial,sans-serif" font-size="19" fill="#5b6678">Google says Agent Gateway is the supported enforcement point in this preview</text><text x="1136" y="635" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="1.5" fill="#8791a2">FIELD NOTE · 22 NOV 2026</text></svg>