<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="One editorial method. Two product surfaces."><rect width="1200" height="675" fill="#f7f7f3"/><rect x="64" y="52" width="8" height="34" rx="4" fill="#4263eb"/><text x="92" y="76" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#4263eb">PRODUCT DESIGN</text><text x="64" y="145" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#172338">One editorial method. Two product surfaces.</text><text x="64" y="190" font-family="Inter,Arial,sans-serif" font-size="23" fill="#5b6678">A portable skill and a dedicated workspace answer different workflow needs.</text><rect x="89" y="250" width="500" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="89" y="250" width="500" height="10" rx="5" fill="#4263eb"/><text x="111" y="302" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172338">SECOND READ SKILL</text><text x="111" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">Portable instructions</text><text x="111" y="382" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">for an agent host</text><text x="111" y="416" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">Read, propose, anchor</text><text x="111" y="450" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">and let the author decide</text><path d="M 593 365 h 14 m -10 -8 l 10 8 l -10 8" fill="none" stroke="#4263eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="611" y="250" width="500" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="611" y="250" width="500" height="10" rx="5" fill="#4263eb"/><text x="633" y="302" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172338">SECOND READ STUDIO</text><text x="633" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">A dedicated workspace</text><text x="633" y="382" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">for the writing process</text><text x="633" y="416" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">A separate product surface</text><text x="633" y="450" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">under development</text><line x1="64" y1="555" x2="1136" y2="555" stroke="#d9dfeb" stroke-width="2"/><text x="64" y="598" font-family="Inter,Arial,sans-serif" font-size="19" fill="#5b6678">Product positioning diagram · does not imply a specific hosted feature is shipped</text><text x="1136" y="635" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="1.5" fill="#8791a2">FIELD NOTE · 22 NOV 2026</text></svg>