<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Five proposed revenue streams in the EU budget</title>
<desc id="d">A diagram lists five proposed revenue streams in António Costa's 21 November 2026 proposal for the EU long-term budget.</desc>
<rect width="1200" height="675" fill="#101820"/>
<text x="72" y="82" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">Five proposed revenue streams</text>
<text x="72" y="126" fill="#A9B8C5" font-family="Inter,Arial,sans-serif" font-size="21">António Costa's 21 November proposal for the 2028–2034 EU budget.</text>
<g font-family="Inter,Arial,sans-serif">
<rect x="72" y="185" width="500" height="105" rx="16" fill="#17362F" stroke="#63C8B4" stroke-width="2"/>
<text x="108" y="230" fill="#83DCCB" font-size="17" font-weight="700">01</text>
<text x="160" y="248" fill="#F3F6F8" font-size="23" font-weight="700">Digital-services revenues</text>
<text x="160" y="276" fill="#A9B8C5" font-size="17">From large companies</text>
<rect x="628" y="185" width="500" height="105" rx="16" fill="#1D2A35" stroke="#4C6070" stroke-width="2"/>
<text x="664" y="230" fill="#9DB3C3" font-size="17" font-weight="700">02</text>
<text x="716" y="248" fill="#F3F6F8" font-size="23" font-weight="700">Carbon Border Adjustment</text>
<text x="716" y="276" fill="#A9B8C5" font-size="17">Mechanism revenues</text>
<rect x="72" y="325" width="500" height="105" rx="16" fill="#1D2A35" stroke="#4C6070" stroke-width="2"/>
<text x="108" y="370" fill="#9DB3C3" font-size="17" font-weight="700">03</text>
<text x="160" y="388" fill="#F3F6F8" font-size="23" font-weight="700">Non-recycled e-waste</text>
<text x="160" y="416" fill="#A9B8C5" font-size="17">A proposed resource stream</text>
<rect x="628" y="325" width="500" height="105" rx="16" fill="#1D2A35" stroke="#4C6070" stroke-width="2"/>
<text x="664" y="370" fill="#9DB3C3" font-size="17" font-weight="700">04</text>
<text x="716" y="388" fill="#F3F6F8" font-size="23" font-weight="700">Tobacco products</text>
<text x="716" y="416" fill="#A9B8C5" font-size="17">Gradual introduction proposed</text>
<rect x="72" y="465" width="1056" height="80" rx="16" fill="#2B2C1D" stroke="#D6B66B" stroke-width="2"/>
<text x="108" y="514" fill="#E8C97D" font-size="17" font-weight="700">05</text>
<text x="160" y="514" fill="#F3F6F8" font-size="23" font-weight="700">Carbon Emissions Trading System</text>
<text x="72" y="590" fill="#E8C97D" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Proposal for leaders' 26–27 November talks — not an adopted tax or budget.</text>
<text x="72" y="635" fill="#718596" font-family="Inter,Arial,sans-serif" font-size="14">Council of the European Union • President Costa's proposal • 21 November 2026</text>
</g>
</svg>