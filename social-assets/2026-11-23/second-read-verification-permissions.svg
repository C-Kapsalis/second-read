<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Product verification has two opt-in gates</title>
<desc id="d">A diagram shows repository inspection as the default, with separate explicit flags required for local command execution and network requests.</desc>
<rect width="1200" height="675" fill="#101820"/>
<text x="72" y="82" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">Verification has two opt-in gates</text>
<text x="72" y="126" fill="#A9B8C5" font-family="Inter,Arial,sans-serif" font-size="21">Reading a project should not silently execute it or contact the network.</text>
<rect x="72" y="190" width="300" height="285" rx="18" fill="#1D2A35" stroke="#63C8B4" stroke-width="2"/>
<text x="102" y="235" fill="#83DCCB" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">DEFAULT</text>
<text x="102" y="294" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Inspect sources</text>
<text x="102" y="342" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">• file existence</text>
<text x="102" y="377" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">• exact text</text>
<text x="102" y="412" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">• configuration</text>
<text x="102" y="452" fill="#83DCCB" font-family="Inter,Arial,sans-serif" font-size="16">No command or network</text>
<path d="M390 332 H445" stroke="#9DB3C3" stroke-width="4"/>
<path d="M431 318 L447 332 L431 346" stroke="#9DB3C3" stroke-width="4" fill="none"/>
<rect x="465" y="190" width="300" height="285" rx="18" fill="#2B2C1D" stroke="#D6B66B" stroke-width="2"/>
<text x="495" y="235" fill="#E8C97D" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">GATE 1</text>
<text x="495" y="294" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">--allow-exec</text>
<text x="495" y="345" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">Run declared local</text>
<text x="495" y="377" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">commands against</text>
<text x="495" y="409" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">the selected checkout.</text>
<text x="495" y="452" fill="#E8C97D" font-family="Inter,Arial,sans-serif" font-size="16">Explicit permission</text>
<path d="M783 332 H838" stroke="#9DB3C3" stroke-width="4"/>
<path d="M824 318 L840 332 L824 346" stroke="#9DB3C3" stroke-width="4" fill="none"/>
<rect x="858" y="190" width="270" height="285" rx="18" fill="#2A2538" stroke="#B49AD9" stroke-width="2"/>
<text x="888" y="235" fill="#C8B4E7" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">GATE 2</text>
<text x="888" y="294" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">--allow-network</text>
<text x="888" y="345" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">Fetch selected public</text>
<text x="888" y="377" fill="#C5D0D8" font-family="Inter,Arial,sans-serif" font-size="19">URLs for evidence.</text>
<text x="888" y="452" fill="#C8B4E7" font-family="Inter,Arial,sans-serif" font-size="16">Separate permission</text>
<text x="72" y="550" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">One review, three different trust boundaries.</text>
<text x="72" y="594" fill="#A9B8C5" font-family="Inter,Arial,sans-serif" font-size="19">Second Read product_verify.py • command and network access are opt-in</text>
<text x="72" y="635" fill="#718596" font-family="Inter,Arial,sans-serif" font-size="14">Open-source implementation diagram • not a security certification</text>
</svg>