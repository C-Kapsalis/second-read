<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Clarity must not increase certainty</title>
<desc id="d">An editorial diagram compares a source claim using may with a safe edit using could and an unsafe rewrite using will.</desc>
<rect width="1200" height="675" fill="#101820"/>
<text x="72" y="82" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">Clarity must not increase certainty</text>
<text x="72" y="126" fill="#A9B8C5" font-family="Inter,Arial,sans-serif" font-size="21">An edit can improve the sentence without upgrading the evidence.</text>
<rect x="72" y="190" width="315" height="250" rx="18" fill="#1D2A35" stroke="#4C6070" stroke-width="2"/>
<text x="102" y="235" fill="#9DB3C3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">SOURCE</text>
<text x="102" y="302" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="28">The change may</text>
<text x="102" y="342" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="28">reduce churn.</text>
<text x="102" y="398" fill="#9DB3C3" font-family="Inter,Arial,sans-serif" font-size="17">Evidence: possibility</text>
<path d="M405 315 H470" stroke="#63C8B4" stroke-width="4" fill="none"/>
<path d="M456 301 L472 315 L456 329" stroke="#63C8B4" stroke-width="4" fill="none"/>
<rect x="490" y="190" width="315" height="250" rx="18" fill="#17362F" stroke="#63C8B4" stroke-width="2"/>
<text x="520" y="235" fill="#83DCCB" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">SAFE EDIT</text>
<text x="520" y="302" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="28">The change could</text>
<text x="520" y="342" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="28">reduce churn.</text>
<text x="520" y="398" fill="#83DCCB" font-family="Inter,Arial,sans-serif" font-size="17">Evidence: possibility</text>
<rect x="845" y="190" width="283" height="250" rx="18" fill="#3B2428" stroke="#D77D82" stroke-width="2"/>
<text x="875" y="235" fill="#F09A9F" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">UNSAFE REWRITE</text>
<text x="875" y="302" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="28">The change will</text>
<text x="875" y="342" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="28">reduce churn.</text>
<text x="875" y="398" fill="#F09A9F" font-family="Inter,Arial,sans-serif" font-size="17">Evidence: certainty added</text>
<path d="M875 286 L1098 355 M1098 286 L875 355" stroke="#F09A9F" stroke-width="5" opacity=".75"/>
<text x="72" y="540" fill="#F3F6F8" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Editorial rule</text>
<text x="72" y="582" fill="#A9B8C5" font-family="Inter,Arial,sans-serif" font-size="21">Improve readability. Preserve the source's level of certainty.</text>
<text x="72" y="635" fill="#718596" font-family="Inter,Arial,sans-serif" font-size="14">Second Read Studio • editorial design principle • not a product screenshot</text>
</svg>