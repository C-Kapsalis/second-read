<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Two different checks at the API edge</title><desc id="desc">AWS WAF separates deterministic protocol validation from content inspection.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
  <style>
    .h{font:700 42px Inter,Arial,sans-serif;fill:#152238}
    .sub{font:400 23px Inter,Arial,sans-serif;fill:#536176}
    .k{font:700 17px Inter,Arial,sans-serif;letter-spacing:2px;fill:#60718A}
    .label{font:700 24px Inter,Arial,sans-serif;fill:#17263C}
    .body{font:400 20px Inter,Arial,sans-serif;fill:#4D5C70}
    .small{font:400 16px Inter,Arial,sans-serif;fill:#65758B}
    .mono{font:600 18px ui-monospace,Menlo,Consolas,monospace;fill:#24364E}
  </style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="48" y="42" width="8" height="86" rx="4" fill="#2C7A78"/>
<text x="82" y="83" class="h">Two different checks at the API edge</text>
<text x="82" y="122" class="sub">AWS WAF separates deterministic protocol validation from content inspection.</text>

 <rect x="64" y="206" width="220" height="220" rx="18" fill="#FFFFFF" stroke="#C9D5E3" stroke-width="2"/>
 <text x="92" y="250" class="k">DISCOVER</text><text x="92" y="308" class="label">LLM / MCP /</text><text x="92" y="342" class="label">A2A traffic</text><text x="92" y="390" class="small">API Portal</text>
 <path d="M298 316 H344" stroke="#7E91A8" stroke-width="4"/><path d="M332 304 L346 316 L332 328" stroke="#7E91A8" stroke-width="4" fill="none"/>
 <rect x="354" y="206" width="330" height="220" rx="18" fill="#EEF4FF" stroke="#9DB8F2" stroke-width="2"/>
 <text x="384" y="250" class="k">DETERMINISTIC</text><text x="384" y="308" class="label">Protocol validation</text><text x="384" y="350" class="body">MCP / A2A version +</text><text x="384" y="380" class="body">header/body consistency</text>
 <path d="M698 316 H744" stroke="#7E91A8" stroke-width="4"/><path d="M732 304 L746 316 L732 328" stroke="#7E91A8" stroke-width="4" fill="none"/>
 <rect x="754" y="206" width="382" height="220" rx="18" fill="#FFF6E0" stroke="#E8C36A" stroke-width="2"/>
 <text x="784" y="250" class="k">CONTENT INSPECTION</text><text x="784" y="308" class="label">Bedrock Guardrails</text><text x="784" y="350" class="body">Prompt attacks, filters,</text><text x="784" y="380" class="body">sensitive information</text>
 <rect x="64" y="466" width="1072" height="80" rx="16" fill="#FDECEC" stroke="#EBA3A3" stroke-width="2"/>
 <text x="96" y="500" class="label">Important limitation</text><text x="96" y="531" class="body">If Guardrails cannot assess a request, WAF labels it and lets it through.</text>
 
<line x1="64" y1="615" x2="1136" y2="615" stroke="#D7DFE9" stroke-width="2"/>
<text x="66" y="649" class="k">AWS WAF · VENDOR-DOCUMENTED CAPABILITY</text>
<text x="1135" y="649" text-anchor="end" class="small">1200 × 675</text>
</svg>