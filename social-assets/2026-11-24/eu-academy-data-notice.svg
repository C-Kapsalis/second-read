<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">EU Academy: what is known</title><desc id="desc">The new disclosure concerns users outside EU institutions.</desc>
<rect width="1200" height="675" fill="#0B1422"/>
<rect x="54" y="48" width="8" height="82" rx="4" fill="#7BD3C6"/>
<text x="86" y="70" fill="#7BD3C6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">FIELD NOTES / 24 NOV 2026</text>
<text x="86" y="119" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">EU Academy: what is known</text>
<text x="86" y="159" fill="#B9C5D4" font-family="Inter,Arial,sans-serif" font-size="21">The new disclosure concerns users outside EU institutions.</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71839A"/></marker></defs>
      <rect x="60" y="255" width="300" height="225" rx="18" fill="#162338" stroke="#334963" stroke-width="2"/>
<rect x="60" y="255" width="8" height="225" rx="4" fill="#7BD3C6"/>
<text x="86" y="309" fill="#7BD3C6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">22 OCT 2026</text><text x="86" y="350" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">Commission detects</text><text x="86" y="384" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">the cyber incident.</text>
      <line x1="365" y1="365" x2="415" y2="365" stroke="#71839A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="425" y="255" width="330" height="225" rx="18" fill="#162338" stroke="#334963" stroke-width="2"/>
<rect x="425" y="255" width="8" height="225" rx="4" fill="#E8C36A"/>
<text x="451" y="309" fill="#E8C36A" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">23 NOV 2026</text><text x="451" y="350" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">Users warned; names and</text><text x="451" y="384" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">email addresses confirmed taken.</text>
      <line x1="760" y1="365" x2="810" y2="365" stroke="#71839A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="820" y="255" width="320" height="225" rx="18" fill="#162338" stroke="#334963" stroke-width="2"/>
<rect x="820" y="255" width="8" height="225" rx="4" fill="#E58C72"/>
<text x="846" y="309" fill="#E58C72" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">STILL UNKNOWN</text><text x="846" y="350" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">Affected-user count</text><text x="846" y="384" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">and full scope.</text>
      <text x="600" y="548" text-anchor="middle" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">Platform access was disabled during the investigation.</text>
