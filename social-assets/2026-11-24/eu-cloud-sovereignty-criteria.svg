<text x="86" y="299" fill="#7BD3C6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">OPERATIONAL AUTONOMY</text><text x="86" y="340" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">Can the service keep operating under local control?</text>
      <rect x="630" y="245" width="510" height="135" rx="18" fill="#162338" stroke="#334963" stroke-width="2"/>
