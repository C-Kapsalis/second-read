<text x="656" y="299" fill="#E8C36A" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">KEY CONTROL</text><text x="656" y="340" fill="#D6DFE9" font-family="Inter,Arial,sans-serif" font-size="21">Who controls the encryption keys?</text>
      <rect x="60" y="410" width="510" height="135" rx="18" fill="#162338" stroke="#334963" stroke-width="2"/>
