<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Robots.txt is not a contract</title><desc id="desc">Comparison of a technical crawler access rule and the commercial terms governing permissions and obligations, with Meta's proposed changes on hold pending further consultation.</desc>
<rect width="1200" height="675" fill="#0B1422"/>
<rect x="54" y="48" width="8" height="82" rx="4" fill="#7BD3C6"/>
<text x="86" y="70" fill="#7BD3C6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">FIELD NOTES / 24 NOV 2026</text>
<text x="86" y="119" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">Robots.txt is not a contract</text>
<text x="86" y="159" fill="#B9C5D4" font-family="Inter,Arial,sans-serif" font-size="21">Crawler access rules and commercial terms answer different questions.</text>
<rect x="60" y="230" width="500" height="250" rx="18" fill="#162338" stroke="#334963" stroke-width="2"/>
<rect x="60" y="230" width="8" height="250" rx="4" fill="#7BD3C6"/>
<text x="90" y="280" fill="#7BD3C6" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="1.2">ROBOTS.TXT</text>
<text x="90" y="333" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">Which paths may</text>
<text x="90" y="370" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">a crawler request?</text>
<text x="90" y="425" fill="#B9C5D4" font-family="Inter,Arial,sans-serif" font-size="20">A technical access convention.</text>
<rect x="640" y="230" width="500" height="250" rx="18" fill="#162338" stroke="#334963" stroke-width="2"/>
<rect x="640" y="230" width="8" height="250" rx="4" fill="#E8C36A"/>
<text x="670" y="280" fill="#E8C36A" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="1.2">COMMERCIAL TERMS</text>
<text x="670" y="333" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">What permissions</text>
<text x="670" y="370" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">and obligations apply?</text>
<text x="670" y="425" fill="#B9C5D4" font-family="Inter,Arial,sans-serif" font-size="20">Contractual rights and product use.</text>
<rect x="60" y="510" width="1080" height="70" rx="14" fill="#20324A" stroke="#3A526F" stroke-width="2"/>
<text x="90" y="553" fill="#F4F7FB" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600">Meta's proposed changes remain on hold; further engagement is planned for early 2027.</text>
