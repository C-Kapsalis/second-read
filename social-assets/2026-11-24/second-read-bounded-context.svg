<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Context should be selected, not dumped</title><desc id="desc">The optional helper discovers candidate notes; it does not certify them.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
  <style>
    .h{font:700 42px Inter,Arial,sans-serif;fill:#152238}
    .sub{font:400 23px Inter,Arial,sans-serif;fill:#536176}
    .k{font:700 17px Inter,Arial,sans-serif;letter-spacing:2px;fill:#60718A}
    .label{font:700 24px Inter,Arial,sans-serif;fill:#17263C}
    .body{font:400 20px Inter,Arial,sans-serif;fill:#4D5C70}
    .small{font:400 16px Inter,Arial,sans-serif;fill:#65758B}
    .mono{font:600 18px ui-monospace,Menlo,Consolas,monospace;fill:#24364E}
  </style>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="48" y="42" width="8" height="86" rx="4" fill="#2C7A78"/>
<text x="82" y="83" class="h">Context should be selected, not dumped</text>
<text x="82" y="122" class="sub">The optional helper discovers candidate notes; it does not certify them.</text>

 <rect x="64" y="205" width="220" height="220" rx="20" fill="#FFFFFF" stroke="#C9D5E3" stroke-width="2"/>
