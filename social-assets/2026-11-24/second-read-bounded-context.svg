 <path d="M298 315 H350" stroke="#7E91A8" stroke-width="4"/><path d="M338 303 L352 315 L338 327" stroke="#7E91A8" stroke-width="4" fill="none"/>
 <rect x="360" y="205" width="240" height="220" rx="20" fill="#EEF4FF" stroke="#9DB8F2" stroke-width="2"/>
 <text x="388" y="250" class="k">DISCOVERY</text><text x="388" y="304" class="label">Bounded</text><text x="388" y="338" class="label">candidate scan</text><text x="388" y="384" class="small">Markdown / Obsidian</text>
 <path d="M614 315 H666" stroke="#7E91A8" stroke-width="4"/><path d="M654 303 L668 315 L654 327" stroke="#7E91A8" stroke-width="4" fill="none"/>
 <rect x="676" y="205" width="240" height="220" rx="20" fill="#FFFFFF" stroke="#C9D5E3" stroke-width="2"/>
 <text x="704" y="250" class="k">OUTPUT</text><text x="704" y="304" class="label">Paths + limited</text><text x="704" y="338" class="label">metadata</text><text x="704" y="384" class="small">No whole note bodies</text>
 <path d="M930 315 H982" stroke="#7E91A8" stroke-width="4"/><path d="M970 303 L984 315 L970 327" stroke="#7E91A8" stroke-width="4" fill="none"/>
 <rect x="992" y="205" width="144" height="220" rx="20" fill="#E7F6F1" stroke="#8BCBBA" stroke-width="2"/>
 <text x="1016" y="250" class="k">JUDGMENT</text><text x="1016" y="304" class="label">Read</text><text x="1016" y="338" class="label">what fits</text>
 <rect x="64" y="466" width="1072" height="76" rx="16" fill="#FFF6E0" stroke="#E8C36A" stroke-width="2"/>
