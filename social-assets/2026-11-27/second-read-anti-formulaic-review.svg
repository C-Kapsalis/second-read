<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Review the phrase, not the author's origin</title><desc id="desc">No AI-likeness score. No authorship inference.</desc><defs><style>.eyebrow{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#52717B}.title{font:700 42px Arial,sans-serif;fill:#1D2A33}.label{font:700 25px Arial,sans-serif;fill:#1D2A33}.body{font:400 20px Arial,sans-serif;fill:#33434F}.num{font:700 14px Arial,sans-serif;fill:#FFFFFF}.foot{font:400 18px Arial,sans-serif;fill:#53636F}</style></defs><rect width="1200" height="675" fill="#F5F6F3"/><rect x="38" y="34" width="1124" height="607" rx="26" fill="#FFFFFF" stroke="#DCE2E4" stroke-width="2"/><text x="76" y="92" class="eyebrow">SECOND READ · ANTI-FORMULAIC PROSE</text><text x="76" y="162" class="title">Review the phrase, not the author's origin</text><path d="M76 194 H1124" stroke="#E2E7E8" stroke-width="2"/><g><rect x="76" y="250" width="328" height="248" rx="20" fill="#EAF1F7" stroke="#CBD5DE" stroke-width="2"/><circle cx="110" cy="284" r="18" fill="#2D6970"/><text x="110" y="291" text-anchor="middle" class="num">01</text><text x="104" y="334" class="label">Exact phrase</text><text x="104" y="376" class="body">quote the passage</text><text x="104" y="410" class="body">keep source span visible</text></g><g><rect x="436" y="250" width="328" height="248" rx="20" fill="#EEF5F1" stroke="#CBD5DE" stroke-width="2"/><circle cx="470" cy="284" r="18" fill="#2D6970"/><text x="470" y="291" text-anchor="middle" class="num">02</text><text x="464" y="334" class="label">Reader cost</text><text x="464" y="376" class="body">name the actual harm</text><text x="464" y="410" class="body">meaning, rhythm, specificity</text></g><g><rect x="796" y="250" width="328" height="248" rx="20" fill="#F7F0E8" stroke="#CBD5DE" stroke-width="2"/><circle cx="830" cy="284" r="18" fill="#2D6970"/><text x="830" y="291" text-anchor="middle" class="num">03</text><text x="824" y="334" class="label">Smallest edit</text><text x="824" y="376" class="body">use supplied facts</text><text x="824" y="410" class="body">leave it unchanged if better</text></g><path d="M410 374 H428 M422 366 L430 374 L422 382" fill="none" stroke="#6B7B87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 374 H788 M782 366 L790 374 L782 382" fill="none" stroke="#6B7B87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 548 H1124" stroke="#E2E7E8" stroke-width="2"/><text x="76" y="590" class="foot">No AI-likeness score. No authorship inference.</text></svg>