" fill="#1B1F24"><tspan x="628" dy="0">Memory corruption</tspan></text><text x="628" y="378" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#46505C"><tspan x="628" dy="0">Possible disclosure or code</tspan><tspan x="628" dy="21">execution</tspan></text><path d="M860 334 H881" stroke="#8A94A6" stroke-width="3" fill="none"/><path d="M872 327 L881 334 L872 341" stroke="#8A94A6" stroke-width="3" fill="none"/><rect x="888" y="250" width="246" height="168" rx="18" fill="#E7F6EC" stroke="#8BCB9F" stroke-width="2"/><circle cx="912" cy="277" r="13" fill="#8BCB9F"/><text x="912" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#1B1F24">4</text><text x="908" y="323" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1B1F24"><tspan x="908" dy="0">Patch + inventory</tspan></text><text x="908" y="378" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#46505C"><tspan x="908" dy="0">Include runtimes bundled in</tspan><tspan x="908" dy="21">products</tspan></text>
