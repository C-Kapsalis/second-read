<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
 <title id="title">Three states for a product claim</title><desc id="desc">A source file, a command result and a live behaviour claim require different evidence. A README can support documentation; it cannot prove runtime behaviour</desc>
 <rect width="1200" height="675" fill="#FAFAF7"/>
 <rect x="48" y="42" width="7" height="42" rx="3" fill="#4F7D78"/>
 <text x="72" y="69" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.6" fill="#52616B">SECOND READ SKILL · PRODUCT EVIDENCE</text>
 <text x="48" y="142" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750" fill="#18222B">Three states for a product claim</text>
 <text x="48" y="190" font-family="Inter,Arial,sans-serif" font-size="19" fill="#56616B">A source file, a command result and a live behaviour claim require different evidence.</text>
 <rect x="48" y="250" width="246" height="168" rx="18" fill="#EEF4FF" stroke="#9DB8F2" stroke-width="2"/><circle cx="72" cy="277" r="13" fill="#9DB8F2"/><text x="72" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#1B1F24">1</text><text x="68" y="323" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1B1F24"><tspan x="68" dy="0">Document the claim</tspan></text><text x="68" y="378" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#46505C"><tspan x="68" dy="0">Quote the exact source span</tspan></text><path d="M300 334 H321" stroke="#8A94A6" stroke-width="3" fill="none"/><path d="M312 327 L321 334 L312 341" stroke="#8A94A6" stroke-width="3" fill="none"/><rect x="328" y="250" width="246" height="168" rx="18" fill="#F3EEFF" stroke="#B9A6F0" stroke-width="2"/><circle cx="352" cy="277" r="13" fill="#B9A6F0"/><text x="352" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#1B1F24">2</text><text x="348" y="323" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1B1F24"><tspan x="348" dy="0">Check available</tspan><tspan x="348" dy="27">evidence</tspan></text><text x="348" y="378" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#46505C"><tspan x="348" dy="0">Inspect files and</tspan><tspan x="348" dy="21">references</tspan></text><path d="M580 334 H601" stroke="#8A94A6" stroke-width="3" fill="none"/><path d="M592 327 L601 334 L592 341" stroke="#8A94A6" stroke-width="3" fill="none"/><rect x="608" y="250" width="246" height="168" rx="18" fill="#FFF6E0" stroke="#E8C36A" stroke-width="2"/><circle cx="632" cy="277" r="13" fill="#E8C36A"/><text x="632" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#1B1F24">3</text><text x="628" y="323" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1B1F24"><tspan x="628" dy="0">Classify the result</tspan></text><text x="628" y="378" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#46505C"><tspan x="628" dy="0">Corroborated · contradicted</tspan><tspan x="628" dy="21">· unknown</tspan></text><path d="M860 334 H881" stroke="#8A94A6" stroke-width="3" fill="none"/><path d="M872 327 L881 334 L872 341" stroke="#8A94A6" stroke-width="3" fill="none"/><rect x="888" y="250" width="246" height="168" rx="18" fill="#E7F6EC" stroke="#8BCB9F" stroke-width="2"/><circle cx="912" cy="277" r="13" fill="#8BCB9F"/><text x="912" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#1B1F24">4</text><text x="908" y="323" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1B1F24"><tspan x="908" dy="0">Opt in to probes</tspan></text><text x="908" y="378" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#46505C"><tspan x="908" dy="0">Commands / network need</tspan><tspan x="908" dy="21">explicit flags</tspan></text>
 <rect x="48" y="476" width="1104" height="92" rx="14" fill="#F1F3F2" stroke="#D5DBD8"/>
 <text x="72" y="512" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#64736E">READ THIS WITH THE EVIDENCE</text>
 <text x="72" y="545" font-family="Inter,Arial,sans-serif" font-size="17" fill="#26343B">A README can support documentation; it cannot prove runtime behaviour</text>
 <text x="48" y="625" font-family="Inter,Arial,sans-serif" font-size="13" fill="#77818A">INDEPENDENT TECHNOLOGY NOTES · 28 NOV 2026</text>
 <text x="1152" y="625" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" fill="#77818A">1200 × 675</text>
