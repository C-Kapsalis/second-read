 <text x="72" y="69" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.6" fill="#52616B">SECOND READ STUDIO · PRODUCT DESIGN</text>
 <text x="48" y="142" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750" fill="#18222B">A preference can become a proposal</text>
 <text x="48" y="190" font-family="Inter,Arial,sans-serif" font-size="19" fill="#56616B">The writer's decisions inform candidate project rules; they do not silently become policy.</text>
