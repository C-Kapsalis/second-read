<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
 <title id="title">A preference can become a proposal</title><desc id="desc">The writer's decisions inform candidate project rules; they do not silently become policy. Product-material description · proposal is not automatic policy</desc>
 <rect width="1200" height="675" fill="#FAFAF7"/>
